<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="678px" preserveAspectRatio="none" style="width:1024px;height:678px;background:#FFFFFF;" version="1.1" viewBox="0 0 1024 678" width="1024px" zoomAndPan="magnify"><title>FestaLink &#8212; Vis&#227;o Geral do Produto</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="'Helvetica'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="243.1475" x="383.8208" y="24.5332">FestaLink &#8212; Vis&#227;o Geral do Produto</text></g><!--cluster sys--><g class="cluster" data-entity="sys" data-source-line="20" data-uid="ent0004" id="cluster_sys"><rect fill="#F5F7FB" height="445" rx="5" ry="5" style="stroke:#4B5563;stroke-width:1;" width="293" x="7" y="227.1094"/><text fill="#111827" font-family="'Helvetica'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="65.3516" x="120.8242" y="243.6426">FestaLink</text></g><!--entity appc--><g class="entity" data-entity="appc" data-source-line="21" data-uid="ent0005" id="entity_appc"><rect fill="#F5F7FB" height="55.2188" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="92.3789" x="92" y="271.1094"/><text fill="#111827" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="72.3789" x="102" y="295.6426">App Cliente</text><text fill="#111827" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="49" x="102" y="313.252">(Flutter)</text></g><!--entity appp--><g class="entity" data-entity="appp" data-source-line="22" data-uid="ent0006" id="entity_appp"><rect fill="#F5F7FB" height="55.2188" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="109.4961" x="123.5" y="593.1094"/><text fill="#111827" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="133.5" y="617.6426">App Prestador</text><text fill="#111827" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="49" x="133.5" y="635.252">(Flutter)</text></g><!--entity back--><g class="entity" data-entity="back" data-source-line="23" data-uid="ent0007" id="entity_back"><rect fill="#F5F7FB" height="72.8281" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="135.5479" x="70" y="415.1094"/><text fill="#111827" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="54.4824" x="80" y="439.6426">Backend</text><text fill="#111827" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="87.5068" x="80" y="457.252">REST + MOM</text><text fill="#111827" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="115.5479" x="80" y="474.8613">(Node.js + SQLite)</text></g><!--entity cliente--><g class="entity" data-entity="cliente" data-source-line="17" data-uid="ent0002" id="entity_cliente"><ellipse cx="138.2446" cy="52.6094" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M138.2446,60.6094 L138.2446,87.6094 M125.2446,68.6094 L151.2446,68.6094 M138.2446,87.6094 L125.2446,102.6094 M138.2446,87.6094 L151.2446,102.6094" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="43.5791" x="97" y="118.6426">Cliente</text><text fill="#000000" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="82.4893" x="97" y="136.252">(quem aluga)</text></g><!--entity prestador--><g class="entity" data-entity="prestador" data-source-line="18" data-uid="ent0003" id="entity_prestador"><ellipse cx="969.1445" cy="412.6094" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M969.1445,420.6094 L969.1445,447.6094 M956.1445,428.6094 L982.1445,428.6094 M969.1445,447.6094 L956.1445,462.6094 M969.1445,447.6094 L982.1445,462.6094" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="60.6963" x="920.5" y="478.6426">Prestador</text><text fill="#000000" font-family="'Helvetica'" font-size="14" lengthAdjust="spacing" textLength="97.2891" x="920.5" y="496.252">(dono do sal&#227;o)</text></g><g class="entity" data-entity="GMN13" data-source-line="34" data-uid="ent0014" id="entity_GMN13"><path d="M214.5,59.1094 L214.5,87.6094 L179.13,91.6094 L214.5,95.6094 L214.5,124.5156 A5,5 0 0 0 219.5,129.5156 L446.7964,129.5156 A5,5 0 0 0 451.7964,124.5156 L451.7964,64.1094 L441.7964,54.1094 L219.5,54.1094 A5,5 0 0 0 214.5,59.1094" fill="#FFF7E6" style="stroke:#B58900;stroke-width:0.5;"/><path d="M441.7964,54.1094 L441.7964,61.6094 A2.5,2.5 0 0 0 444.2964,64.1094 L451.7964,64.1094 L441.7964,54.1094" fill="#FFF7E6" style="stroke:#B58900;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119.9326" x="220.5" y="72.6045">Valor para o cliente</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="209.041" x="220.5" y="88.9561">&#8226; Achar sal&#245;es dispon&#237;veis sem ligar</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="216.2964" x="220.5" y="105.3076">&#8226; Comparar pre&#231;o, capacidade e data</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="214.1191" x="220.5" y="121.6592">&#8226; Saber r&#225;pido se a reserva foi aceita</text></g><g class="entity" data-entity="GMN16" data-source-line="41" data-uid="ent0017" id="entity_GMN16"><path d="M609,419.1094 L609,484.5156 A5,5 0 0 0 614,489.5156 L880.29,489.5156 A5,5 0 0 0 885.29,484.5156 L885.29,455.6094 L920.29,451.6094 L885.29,447.6094 L885.29,424.1094 L875.29,414.1094 L614,414.1094 A5,5 0 0 0 609,419.1094" fill="#FFF7E6" style="stroke:#B58900;stroke-width:0.5;"/><path d="M875.29,414.1094 L875.29,421.6094 A2.5,2.5 0 0 0 877.79,424.1094 L885.29,424.1094 L875.29,414.1094" fill="#FFF7E6" style="stroke:#B58900;stroke-width:0.5;"/><text fill="#000000" font-family="'Helvetica'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="138.709" x="615" y="432.6045">Valor para o prestador</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="198.9609" x="615" y="448.9561">&#8226; Recebe pedidos direto no celular</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="220.6318" x="615" y="465.3076">&#8226; Aprova ou recusa em poucos toques</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="255.29" x="615" y="481.6592">&#8226; Menos vai-e-vem por telefone e WhatsApp</text></g><g class="entity" data-entity="GMN19" data-source-line="48" data-uid="ent0020" id="entity_GMN19"><path d="M324.5,419.1094 L324.5,484.5156 A5,5 0 0 0 329.5,489.5156 L568.0825,489.5156 A5,5 0 0 0 573.0825,484.5156 L573.0825,424.1094 L563.0825,414.1094 L329.5,414.1094 A5,5 0 0 0 324.5,419.1094" fill="#FFF7E6" style="stroke:#B58900;stroke-width:0.5;"/><path d="M563.0825,414.1094 L563.0825,421.6094 A2.5,2.5 0 0 0 565.5825,424.1094 L573.0825,424.1094 L563.0825,414.1094" fill="#FFF7E6" style="stroke:#B58900;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.8018" x="330.5" y="432.6045">Diferencial:</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="153.1689" x="404.9136" y="432.6045">mobile-first e event-driven.</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="225.4497" x="330.5" y="448.9561">O prestador &#233; notificado em tempo real</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="211.0342" x="330.5" y="465.3076">quando chega uma nova solicita&#231;&#227;o,</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="189.3633" x="330.5" y="481.6592">sem depender de polling do app.</text></g><!--link cliente to appc--><g class="link" data-entity-1="cliente" data-entity-2="appc" data-source-line="26" data-uid="lnk8" id="link_cliente_appc"><path d="M138,139.1294 C138,179.8794 138,231.6694 138,265.0294" fill="none" id="cliente-to-appc" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="138,271.0294,142,262.0294,138,266.0294,134,262.0294,138,271.0294" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="75.8799" x="144.4209" y="183.6045">busca sal&#245;es</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="86.7217" x="139" y="199.9561">e pede reserva</text></g><!--link prestador to appp--><g class="link" data-entity-1="prestador" data-entity-2="appp" data-source-line="27" data-uid="lnk9" id="link_prestador_appp"><path d="M920.29,490.4294 C914.66,493.7294 908.84,496.7194 903,499.1094 C666.6,596.0694 362.4274,614.8912 238.5374,618.5712" fill="none" id="prestador-to-appp" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="232.54,618.7494,241.6548,622.4804,237.5378,618.6009,241.4173,614.4839,232.54,618.7494" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="57.8208" x="825.1741" y="543.6045">aprova ou</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="88.1689" x="810" y="559.9561">recusa pedidos</text></g><!--link appc to back--><g class="link" data-entity-1="appc" data-entity-2="back" data-source-line="29" data-uid="lnk10" id="link_appc_back"><path d="M138,326.2594 C138,350.8994 138,381.6994 138,408.8794" fill="none" id="appc-to-back" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="138,414.8794,142,405.8794,138,409.8794,134,405.8794,138,414.8794" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="88.1182" x="139" y="370.6045">HTTPS / REST</text></g><!--link appp to back--><g class="link" data-entity-1="appp" data-entity-2="back" data-source-line="30" data-uid="lnk11" id="link_appp_back"><path d="M171.6,592.8794 C164.82,564.5894 155.4882,525.6142 147.9782,494.2742" fill="none" id="appp-to-back" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="146.58,488.4394,144.7874,498.1237,147.7452,493.3017,152.5672,496.2595,146.58,488.4394" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="88.1182" x="165" y="551.6045">HTTPS / REST</text></g><!--link back to appp--><g class="link" data-entity-1="back" data-entity-2="appp" data-source-line="31" data-uid="lnk12" id="link_back_appp"><path d="M98.19,488.2094 C78.79,509.9894 62.48,538.3494 77,563.1094 C87.32,580.6994 99.929,590.616 117.909,599.316" fill="none" id="back-to-appp" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="123.31,601.9294,116.9508,594.4087,118.8092,599.7516,113.4663,601.61,123.31,601.9294" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="57.1035" x="84.8682" y="543.6045">evento de</text><text fill="#000000" font-family="'Helvetica'" font-size="13" lengthAdjust="spacing" textLength="70.8398" x="78" y="559.9561">novo pedido</text></g><!--link sys to GMN19--><g class="link" data-entity-1="sys" data-entity-2="GMN19" data-source-line="48" data-uid="lnk21" id="link_sys_GMN19"><path d="M300.0769,307.3785 C300.1734,307.4712 300.2706,307.5647 300.3685,307.6589 C301.936,309.1662 303.6978,310.8604 305.6314,312.7198 C31